services:
  # -------------------------
  # 1. FastAPI Backend
  # -------------------------
  - type: web
    name: enterprise-rag-backend
    env: python
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: GROQ_API_KEY
        sync: false # Set this in Render Dashboard
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard (External MySQL)
      - key: SECRET_KEY
        generateValue: true

  # -------------------------
  # 2. Next.js Frontend
  # -------------------------
  - type: web
    name: enterprise-rag-frontend
    env: node
    region: oregon
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: "18.17.0"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: enterprise-rag-backend
          envVarKey: RENDER_EXTERNAL_URL
